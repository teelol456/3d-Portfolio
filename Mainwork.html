<!DOCTYPE html>
<html>
<head>
<title>Animations</title>
<style>
body {
    margin: 0;
    overflow: hidden;
}
#reset-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    padding: 12px 24px;
    font-size: 16px;
    font-family: sans-serif;
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    cursor: pointer;
    z-index: 100;
    transition: background-color 0.2s;
}
#reset-btn:hover {
    background-color: rgba(80, 80, 80, 0.9);
}
</style>
</head>
<body>

<button id="reset-btn">Reset Camera</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3f3f3f);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(-70, 40, 45);

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(
    0x404040,
    2
);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    3
);
directionalLight.position.set(27.69, 160.52, -779.24);
directionalLight.castShadow = true;
scene.add(directionalLight);

const myPointLight = new THREE.PointLight(0xffffff, 100, 50);
myPointLight.position.set(19.46, 33.30, -18.50);
scene.add(myPointLight);

const myPointLight1 = new THREE.PointLight(0xffffff, 50, 20);
myPointLight1.position.set(-24.38, 17.48, -14.64);
scene.add(myPointLight1);

const clock = new THREE.Clock();

let mixer = null;
let model = null;

let zoomStartTime = null;
const zoomStartPosition = new THREE.Vector3();
const zoomEndPosition = new THREE.Vector3();
const zoomStartTarget = new THREE.Vector3();
const zoomEndTarget = new THREE.Vector3();

const initialCameraPosition = new THREE.Vector3(-70, 40, 45);
const initialCameraTarget = new THREE.Vector3(0, 0, 0);

const video = document.createElement('video');
video.src = 'https://teelol456.github.io/3d-Portfolio/port.mp4';
video.crossOrigin = 'anonymous';
video.loop = true;
video.muted = true;
video.playsInline = true;
video.autoplay = true;

const videoTexture = new THREE.VideoTexture(video);
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;
videoTexture.format = THREE.RGBAFormat;

const videoMaterial = new THREE.MeshBasicMaterial({
    map: videoTexture,
    side: THREE.DoubleSide
});

const loader = new THREE.GLTFLoader();

loader.load(
    'https://teelol456.github.io/3d-Portfolio/Magic.glb',
    (gltf) => {
        model = gltf.scene;

        model.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;

                const name = child.name.toLowerCase();
                console.log("Found mesh:", name);

                if (name.includes("glass")) {
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        metalness: 0,
                        roughness: 0.15,
                        transmission: 0.65,
                        transparent: true,
                        opacity: 0.8,
                        ior: 1.5,
                        side: THREE.DoubleSide
                    });
                    child.material.depthWrite = true;
                }

                if (name.includes("book")) {
                    child.userData.isBook = true;
                }

                if (name.includes("port")) {
                    child.userData.isBlueSign = true;
                }

                if (name === "vid") {
                    child.userData.isVid = true;
                    child.material = videoMaterial;
                    child.material.needsUpdate = true;
                    console.log("Video mesh found:", child.name);
                }
            }
        });

        model.position.set(0, 0, 1);
        model.scale.set(3, 3, 3);
        scene.add(model);

        video.play().catch(() => {});

        mixer = new THREE.AnimationMixer(model);
        console.log("Animations:", gltf.animations.map(a => a.name));

        gltf.animations.forEach((clip) => {
            mixer.clipAction(clip).play();
        });
    },
    undefined,
    (error) => {
        console.error("Error loading Magic.glb:", error);
    }
);

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (mixer) {
        mixer.update(delta);
    }

    if (zoomStartTime !== null) {
        const duration = 700;
        const elapsed = performance.now() - zoomStartTime;
        const progress = Math.min(elapsed / duration, 1);
        const easedProgress = progress * progress * (3 - 2 * progress);

        camera.position.lerpVectors(
            zoomStartPosition,
            zoomEndPosition,
            easedProgress
        );

        controls.target.lerpVectors(
            zoomStartTarget,
            zoomEndTarget,
            easedProgress
        );

        if (progress === 1) {
            zoomStartTime = null;
        }
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('reset-btn').addEventListener('click', () => {
    zoomStartPosition.copy(camera.position);
    zoomStartTarget.copy(controls.target);
    zoomEndPosition.copy(initialCameraPosition);
    zoomEndTarget.copy(initialCameraTarget);
    zoomStartTime = performance.now();
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', (event) => {
    if (event.target.id === 'reset-btn') return;
    if (!model) return;

    if (video.paused) {
        video.play().catch(() => {});
    }

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const objects = [];

    model.traverse((child) => {
        if (child.isMesh) {
            objects.push(child);
        }
    });

    const intersects = raycaster.intersectObjects(objects, true);

    if (intersects.length > 0) {
        const hit = intersects[0];
        const clickedMesh = hit.object;

        zoomStartPosition.copy(camera.position);
        zoomStartTarget.copy(controls.target);
        zoomEndTarget.copy(
            clickedMesh.getWorldPosition(new THREE.Vector3())
        );

        let shouldZoom = false;

        if (clickedMesh.userData.isBook) {
            const distance = 15;

            const direction = camera.position
                .clone()
                .sub(zoomEndTarget)
                .normalize();

            zoomEndPosition.copy(
                zoomEndTarget.clone().add(
                    direction.multiplyScalar(distance)
                )
            );

            shouldZoom = true;

            setTimeout(() => {
                window.open(
                    'https://teelol456.github.io/Transformation/Paint.html',
                    '_blank'
                );
            }, 800);
        }

        else if (clickedMesh.userData.isVid) {
            const distance = 10;

            const videoNormal = new THREE.Vector3(0, -90, 0)

                .applyQuaternion(
                    clickedMesh.getWorldQuaternion(new THREE.Quaternion())
                )
                .normalize();

            zoomEndPosition.copy(
                zoomEndTarget.clone().add(
                    videoNormal.multiplyScalar(distance)
                )
            );

            shouldZoom = true;
        }

        else if (clickedMesh.userData.isBlueSign) {
            const distance = 15;

            const signNormal = new THREE.Vector3(0, 90, 0)
                .applyQuaternion(
                    clickedMesh.getWorldQuaternion(
                        new THREE.Quaternion()
                    )
                )
                .normalize();

            zoomEndPosition.copy(
                zoomEndTarget.clone().add(
                    signNormal.multiplyScalar(distance)
                )
            );

            shouldZoom = true;
        }

        if (shouldZoom) {
            zoomStartTime = performance.now();
        }
    }
});

</script>
</body>
</html>
