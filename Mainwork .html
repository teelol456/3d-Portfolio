<!DOCTYPE html>
<html>
<head>
<title>Animations</title>
<style>
body {
    margin: 0;
    overflow: hidden;
}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 2, 5);

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(
    0x404040,
    1
);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    0.5
);
directionalLight.position.set(10, 10, 10);
directionalLight.castShadow = true;
scene.add(directionalLight);

const exrSkyboxUrl =
    'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/autumn_field_puresky_1k.exr';

const pmremGenerator =
    new THREE.PMREMGenerator(renderer);

pmremGenerator.compileEquirectangularShader();

new THREE.EXRLoader()
.load(
    exrSkyboxUrl,
    (texture) => {
        const skybox =
            pmremGenerator
            .fromEquirectangular(texture)
            .texture;

        scene.background = skybox;
        scene.environment = skybox;

        texture.dispose();
        pmremGenerator.dispose();
    }
);

const clock = new THREE.Clock();

let mixer = null;
let model = null;
let book = null;

const loader = new THREE.GLTFLoader();

loader.load(
    'https://teelol456.github.io/3d-Portfolio/Magic.glb',

    (gltf) => {

        model = gltf.scene;

        model.traverse((child) => {

            if (child.isMesh) {

                child.castShadow = true;
                child.receiveShadow = true;

                const name =
                    child.name.toLowerCase();

                if (
                    name.includes("glass") ||
                    name.includes("window")
                ) {

                    child.material =
                        new THREE.MeshPhysicalMaterial({
                            color: 0xffffff,
                            metalness: 0,
                            roughness: 0.05,
                            transmission: 1,
                            transparent: true,
                            opacity: 0.25,
                            ior: 1.5,
                            thickness: 0.1,
                            side: THREE.DoubleSide
                        });

                    child.material.depthWrite = false;
                }
            }

            if (
                child.name &&
                child.name.toLowerCase() === "book"
            ) {
                book = child;
            }
        });

        model.position.set(0, 0, 1);
        model.scale.set(3, 3, 3);

        scene.add(model);

        mixer =
            new THREE.AnimationMixer(model);

        const clip =
            THREE.AnimationClip.findByName(
                gltf.animations,
                'CircleAction'
            );

        if (clip) {
            mixer
                .clipAction(clip)
                .play();
        }

        console.log("BOOK OBJECT:", book);
    },

    undefined,

    (error) => {
        console.error(
            "Error loading Magic.glb:",
            error
        );
    }
);

function animate() {

    requestAnimationFrame(animate);

    const delta =
        clock.getDelta();

    if (mixer) {
        mixer.update(delta);
    }

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    'click',
    (event) => {

        if (!book) return;

        mouse.x =
            (event.clientX /
            window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY /
            window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const objects = [];

        book.traverse((child) => {

            if (child.isMesh) {
                objects.push(child);
            }

        });

        const intersects =
            raycaster.intersectObjects(
                objects,
                true
            );

        if (intersects.length > 0) {

            window.open(
                'https://teelol456.github.io/Transformation/Paint.html',
                '_blank'
            );
        }
    }
);
</script>
</body>
</html>
